<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面标题</title>
  <!-- Cormorant Garamond（英文衬线，展示标题用） + JetBrains Mono；正文使用系统字体栈，无需引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* 1. All design tokens from references/tokens.md :root block */
    /* 2. [data-theme="dark"] overrides from references/tokens.md */
    /* 3. Base reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-canvas);
      color: var(--color-body);
      font-family: var(--font-body);
      font-size: 17px; line-height: 1.80;
      word-break: break-all; overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background var(--motion-normal) var(--ease-out),
                  color     var(--motion-normal) var(--ease-out);
    }
    /* 4. Chinese typography overrides from references/tokens.md */
    /* 5. Motion utilities from references/motion.md */
    /* 6. Component styles from references/components.md */
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav__container">
      <!-- ... -->
      <div class="top-nav__actions">
        <button class="theme-toggle-btn" data-theme-toggle aria-label="切换主题">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.42 1.42M11.36 11.36l1.42 1.42M3.22 12.78l1.42-1.42M11.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 10.5A6 6 0 016.5 3a6 6 0 000 10A6 6 0 0014 10.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <a href="#" class="btn-primary">立即使用</a>
      </div>
    </div>
  </nav>

  <!-- ① 奶油色 / 深海军蓝 Hero -->
  <section class="hero-band">...</section>

  <!-- ② 深色产品展示 -->
  <section style="background: var(--color-surface-dark); padding: var(--space-section) 0;">
    <div class="section-container">...</div>
  </section>

  <!-- ③ 奶油色 / 深色特性介绍 -->
  <section style="background: var(--color-canvas); padding: var(--space-section) 0;">
    <div class="section-container">...</div>
  </section>

  <!-- ④ Coral CTA 横幅（双主题一致） -->
  <section style="background: var(--color-canvas); padding: var(--space-section) 0;">
    <div class="section-container">
      <div class="cta-band-coral reveal">...</div>
    </div>
  </section>

  <!-- ⑤ 深色页脚 -->
  <footer class="footer">...</footer>

  <script>
    /* ── 主题初始化 ── */
    const html = document.documentElement;
    (function initTheme() {
      const saved = localStorage.getItem('claude-theme');
      if (saved) {
        html.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
      }
    })();
    document.querySelector('[data-theme-toggle]')?.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      if (next === 'light') html.removeAttribute('data-theme');
      else html.setAttribute('data-theme', 'dark');
      localStorage.setItem('claude-theme', next);
    });

    /* ── 滚动揭示 ── */
    const observer = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); observer.unobserve(e.target); }
      }),
      { threshold: 0.15 }
    );
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
